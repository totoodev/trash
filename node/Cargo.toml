[package]
name = "trash-pro-node"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Node.js bindings for trash-pro"

[lib]
crate-type = ["cdylib"]

[dependencies]
trash-pro = { path = "../core" }
napi = { version = "3", features = ["async"] }
napi-derive = "3"

[build-dependencies]
napi-build = "2"
